<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Court SPN</title>
<style>
body{font-family:Arial;margin:0;background:#f2f2f2}
.header{background:#0B2A5B;color:white;padding:20px;text-align:center}
.header h1{margin:0;font-size:22px}
.header p{margin:5px;color:#FFD700}
.search{margin:15px;padding:12px;width:90%;border-radius:10px;border:1px solid #ccc;font-size:16px}
.card{background:white;margin:10px 15px;padding:15px;border-radius:12px}
.card h3{margin:0;color:#0B2A5B}
.btn{background:#FFD700;color:black;padding:10px 15px;border-radius:8px;text-decoration:none;display:inline-block;margin-top:10px;font-weight:bold}
</style>
</head>
<body>
<div class="header"><h1>MY COURT SPN</h1><p>Shahjahanpur Court - Case Status</p></div>
<center><input class="search" id="search" placeholder="Case No. ya Naam se search karein..." onkeyup="filter()"></center>
<div id="list"><center>Loading cases...</center></div>
<script>
const cases = [
["123/2026","Ram vs Shyam","25 Nov 2026","https://google.com"],
["456/2026","Mohan vs Sohan","28 Nov 2026","https://google.com"]
];
let html="";
cases.forEach(row=>{
html+=`<div class="card" data-search="${row[0]} ${row[1]}"><h3>Case No: ${row[0]}</h3><p><b>${row[1]}</b><br>Agli Tarikh: ${row[2]}</p><a class="btn" href="${row[3]}" target="_blank">Order Download Karein</a></div>`;
});
document.getElementById('list').innerHTML=html;
function filter(){let q=document.getElementById('search').value.toLowerCase();document.querySelectorAll('.card').forEach(c=>{c.style.display=c.getAttribute('data-search').toLowerCase().includes(q)?'block':'none';});}
</script>
</body>
</html>
